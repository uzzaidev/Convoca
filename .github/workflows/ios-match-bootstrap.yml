# iOS Match Bootstrap — roda UMA VEZ para gerar Distribution Cert + Provisioning Profile
# Depois disso use o workflow ios-release.yml para builds normais.
#
# Disparo: manual (workflow_dispatch) apenas

name: iOS Match Bootstrap (roda 1x)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Gerar certificados via fastlane match
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sem bundler-cache aqui: Gemfile.lock não existe ainda no repo.
      # O ruby/setup-ruby com bundler-cache:false apenas instala Ruby/Bundler,
      # e o passo seguinte faz bundle install manualmente.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Instalar fastlane via bundle install
        run: bundle install --jobs 4 --retry 3

      # Node/pnpm não são necessários para o bootstrap de certs,
      # mas estão aqui para paridade caso o Fastfile precise.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.18.1"

      - name: fastlane match appstore — gerar e salvar certs
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        # --verbose mostra o erro real do fastlane (autenticação, portal, etc.)
        run: bundle exec fastlane setup_certs --verbose
