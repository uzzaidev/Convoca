# iOS Release — Build + Archive + Upload to TestFlight
#
# Roda no runner macos-26 (Xcode 26.5) do GitHub Actions.
# O build é orquestrado pelo `fastlane beta` (fastlane/Fastfile).
# Disparo: manual (workflow_dispatch) ou push de tag vX.Y.Z
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT   ← conteúdo do .p8 (inclui header -----BEGIN...)
#   MATCH_PASSWORD                       ← senha de criptografia do repo convoca-certs
#   MATCH_GIT_BASIC_AUTHORIZATION        ← base64 de "usuario:ghp_TOKEN" p/ clonar convoca-certs
#   GOOGLE_SERVICE_INFO_PLIST_BASE64     ← base64 do GoogleService-Info.plist

name: iOS Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Versão do app (ex: 1.0.1)"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number (inteiro crescente)"
        required: true
        default: "1"

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-upload:
    name: Build iOS → TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Selecionar Xcode 26.5 explicitamente
      - name: Selecionar Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      # 3. Setup Node
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.18.1"

      # 5. Cache pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # 6. Instalar dependências Node
      - name: Instalar dependências Node
        run: pnpm install --frozen-lockfile

      # 7. Setup Ruby (sem bundler-cache — sem Gemfile.lock no repo)
      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # 8. Instalar fastlane + xcpretty via bundle install
      - name: Instalar fastlane (bundle install)
        run: bundle install --jobs 4 --retry 3

      # 9. Restaurar GoogleService-Info.plist a partir do secret (base64)
      - name: Restaurar GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode \
            > ios/App/App/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist restaurado"

      # 10. Determinar versão e build number (dispatch manual ou tag)
      - name: Determinar APP_VERSION e BUILD_NUMBER
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "APP_VERSION=${{ github.event.inputs.app_version }}" >> $GITHUB_ENV
            echo "BUILD_NUMBER=${{ github.event.inputs.build_number }}" >> $GITHUB_ENV
          else
            TAG="${{ github.ref_name }}"
            echo "APP_VERSION=${TAG#v}" >> $GITHUB_ENV
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # 11. Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # 11b. Pod install — roda AQUI (fora do bundle exec fastlane) para evitar
      #      conflito entre Ruby 3.3 do setup-ruby e Ruby 3.4 do Homebrew.
      #      O sh() do fastlane herda BUNDLE_GEMFILE/RUBYOPT e contamina o pod.
      - name: Pod install (CocoaPods)
        run: |
          cd ios/App
          pod install --repo-update

      # 12. fastlane beta — orquestra tudo: match, build, archive, upload
      #     O Fastfile cuida de: create_keychain, match, update_code_signing_settings,
      #     pnpm build:mobile, pnpm cap sync ios, pod install, gym, pilot.
      - name: fastlane beta → TestFlight
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta

      # 13. Limpar arquivos sensíveis (sempre, mesmo em falha)
      - name: Limpar arquivos sensíveis
        if: always()
        run: |
          rm -f ios/App/App/GoogleService-Info.plist
          echo "✅ Arquivos sensíveis removidos"
